name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck ci/*.sh dev/decidim-dev-update dev/checks.sh railway/deploy-prod.sh

      - name: pin-bump-check tests
        run: bash ci/pin-bump-check_test.sh
