# Builds the decidim.vocdoni.dev image from railway/ (see railway/README.md,
# "Deploying").
# main pushes publish ghcr.io/vocdoni/decidim-vocdoni:sha-<12> and :develop (the
# tag decidim-dev follows); pull requests and workflow_dispatch with push=false
# only build.
name: Image

on:
  push:
    branches: [main]
    paths:
      - "railway/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "railway/**"
      - ".github/workflows/image.yml"
  # Merges made with GITHUB_TOKEN (pin bumps) do not fire `push`; the pin bump
  # workflow dispatches this one instead, with push=false on its PR branch.
  workflow_dispatch:
    inputs:
      push:
        description: "Push sha-<12> and :develop (only honoured on main)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  # main builds all finish: each merge commit needs its sha-<12> for a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/vocdoni/decidim-vocdoni

jobs:
  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve tags and labels
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          PUSH_INPUT: ${{ inputs.push }}
        run: |
          set -euo pipefail
          # Only main moves :develop; any other ref is a check build.
          push=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$PUSH_INPUT" = true ]; }; then
              push=true
            fi
          fi
          rev() { awk -v r="  remote: https://github.com/vocdoni/$1.git" '$0 == r { f = 1 } f && $1 == "revision:" { print $2; exit }' railway/Gemfile.lock; }
          gem_rev=$(rev decidim-secure_elections)
          decidim_rev=$(rev decidim)
          for v in "$gem_rev" "$decidim_rev"; do
            if ! [[ "$v" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::cannot read the pinned revisions from railway/Gemfile.lock"
              exit 1
            fi
          done
          sha12=${GITHUB_SHA:0:12}
          {
            echo "push=$push"
            echo "sha12=$sha12"
            echo "tags<<EOF"
            echo "$IMAGE:sha-$sha12"
            echo "$IMAGE:develop"
            echo "EOF"
            echo "labels<<EOF"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "io.vocdoni.gem-revision=$gem_rev"
            echo "io.vocdoni.decidim-revision=$decidim_rev"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ steps.meta.outputs.push == 'true' && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: railway
          file: railway/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One plain manifest, no attestation index: the digest GHCR reports is
          # the one z4 and Railway pull and the one workflow 3 promotes.
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ steps.meta.outputs.push == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - name: Summary
        env:
          PUSHED: ${{ steps.meta.outputs.push }}
          SHA12: ${{ steps.meta.outputs.sha12 }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### decidim-vocdoni image"
            echo
            if [ "$PUSHED" = true ]; then
              echo "Pushed \`$IMAGE:sha-$SHA12\` and \`$IMAGE:develop\`, digest \`$DIGEST\`."
            else
              echo "Check build of \`$GITHUB_SHA\` (not pushed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
